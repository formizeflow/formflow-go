name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - run: go test ./...
      - name: Source archive
        run: git archive --format=tar.gz --prefix="${{ github.event.repository.name }}-${GITHUB_REF_NAME}/" -o "${{ github.event.repository.name }}-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "*.tar.gz" }
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.tar.gz --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
      # The Go module proxy and checksum database pick the tag up on first "go get".
